name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6" shellcheck-py
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck -x -S style env/*.sh env/*/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # torch is not a declared dependency (ACE-Step pins its own wheels). The tests use
      # the toy backend, so the small CPU-only build is enough. ACE-Step is not installed.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing
      # A real Flower simulation, evaluation and generation on the toy backend.
      - run: env/smoke.sh --no-tests
